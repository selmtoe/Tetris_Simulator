; Source-compatible recovery settings.
; Queue coordinates intentionally remain identical to 蜍慕判隗｣譫・html:
; 1280-wide coordinates, cropW/1280 scale, 5px circular samples.
; Board rectangles are calibrated to the inner 10x20 playfield of the
; Puyo Puyo Tetris layout. This removes the blue/red frame pixels which the
; ONNX model otherwise mistakes for J/Z blocks. Set them back to the source
; rectangles (P1 304,157,366,725 / P2 1250,157,363,725) only when a video
; was recorded with that exact older layout.

[video]
sample_interval=0.01
; 0 = analyze the full video. Set e.g. 60 to review the first 60 seconds,
; then use "邯壹″繧貞・險育ｮ・ in the native review window.
initial_analysis_seconds=0
queue_confirm=2
; The NEXT decoder works on compressed full-history runs.  It only permits
; legal 0/1/2 slides and, by default, a strict Guideline 7-bag generator.
queue_beam_width=96
queue_7bag=1
; Compact RGB CNN is the primary HOLD/NEXT recognizer. Effect/low-black
; crops are marked unclear and excluded from queue-transition evidence; the
; legacy colour result remains available as a provisional fallback.
queue_cnn=1
queue_cnn_unclear_threshold=0.975
queue_cnn_piece_confidence_threshold=0.5
queue_cnn_dark_pixel_limit=40
queue_cnn_dark_ratio_threshold=0.0794
; Force a legal exact match across the established CNN-visible rows when one exists.
; Rows inserted by the same garbage rise remain hypotheses until later frames.
force_exact_onnx=1
onnx_samples=5
beam_width=500
shift_threshold=0.60
; Reviewer warning margin for an unresolved same-mino order. The final GPU
; analysis separately re-reads plausible pairs and resolves the stronger
; order directly while preserving the board after the pair.
order_ambiguity_score_margin=40
score_exact=10
score_empty=1
score_color=-2
score_missing=-5
score_extra=-5
; A newly placed piece's colour and a confirmed garbage hole are stronger
; evidence than generic board-cell agreement.
score_placed_color=60
score_placed_color_mismatch=-80
score_placed_complete=160
score_hole=100
; A different hole column is a structural error, not one ordinary cell miss.
score_hole_mismatch=-600
; Healthy matches stay on the fast linear scorer. Only an unresolved phase or
; sustained board mismatch runs this wider complete-search neural fallback.
accurate_fallback_enabled=1
accurate_fallback_beam_width=256
accurate_fallback_ranker=../models/accurate-fallback-ranker.trnn

[players]
p1_enabled=1
p2_enabled=1

; Player names are read only once from the first frame of each detected
; match. Coordinates below use the centered 1920x1080 (16:9) Switch image,
; so capture letterboxing/pillarboxing does not move the crop.
[player_name_ocr]
enabled=1
prefer_onnx=1
reference_width=1920
reference_height=1080
upscale=3
languages=jpn+eng
onnx_model=../ocr/PP-OCRv6_rec_small.onnx
dictionary=../ocr/ppocrv6_dict.txt
executable=../ocr/tesseract.exe
tessdata=../ocr/tessdata

[p1]
board=316,157,351,713
; Calibrated fixed P1 name rectangle: x,y,width,height
name_crop=252,986,480,36
hold=160,155
next1=500,122
next2=500,175
next3=500,225
next4=500,275
next5=500,325

[p2]
board=1253,157,351,713
; Calibrated fixed P2 name rectangle: x,y,width,height
name_crop=1184,984,480,40
hold=790,155
next1=1130,122
next2=1130,175
next3=1130,225
next4=1130,275
next5=1130,325

