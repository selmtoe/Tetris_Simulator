<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#e9e9e9">
    <title>Simulator</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="../tools/tetris-lab/preview-theme.css">
    <link rel="stylesheet" href="./workspace.css?v=workflow-v2">
    <script type="module" src="./js/workspace.js?v=workflow-v2"></script>
</head>
<body data-mode="simulator">
    <main id="workspace-panes" aria-label="プレイと振り返り">
        <section id="simulator-pane" class="workspace-pane" aria-label="シミュレータ">
            <iframe id="iframe-sim" title="シミュレータ" allow="gamepad; clipboard-read; clipboard-write; fullscreen"></iframe>
        </section>
        <div id="workspace-divider" role="separator" aria-label="左右の幅を調整" aria-orientation="vertical" aria-valuemin="30" aria-valuemax="70" aria-valuenow="50" tabindex="0" hidden></div>
        <section id="viewer-pane" class="workspace-pane" aria-label="リプレイビューワー" hidden>
            <iframe id="iframe-editor-custom" title="リプレイビューワー" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
        </section>
    </main>
    <dialog id="records-dialog" aria-labelledby="records-heading">
        <div class="dialog-heading"><h2 id="records-heading">リプレイを開く</h2><button id="close-records">閉じる</button></div>
        <form id="open-link-form" class="record-form">
            <label for="replay-link">共有リンク・リプレイデータ</label>
            <div><input id="replay-link" type="text" autocomplete="off" placeholder="リンクを貼り付け"><button type="submit">開く</button></div>
        </form>
        <button id="open-file-button">リプレイファイルを選ぶ</button>
        <input id="replay-file" type="file" accept=".json,.txt,.url" hidden>
        <p class="storage-note">ファイルへの書き出し・リンクの共有は、ビューワーの「共有」から行えます。</p>
    </dialog>
    <p id="workspace-status" role="status" aria-live="polite" hidden></p>
</body>
</html>
