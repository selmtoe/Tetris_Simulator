[package]
name = "opening-book"
version = "0.1.0"
edition = "2018"

[dependencies]
libtetris = { path = "../libtetris" }
enumset = { version = "1.0.4", features = ["serde"] }
serde = "1.0"
bincode = "1.3.1"
arrayvec = "0.5"
lazy_static = "1.4.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
ruzstd = "0.2.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
num_cpus = "1.13.0"
zstd = { version = "0.7.0", features = ["zstdmt", "experimental"] }
