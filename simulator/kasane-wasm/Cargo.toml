[package]
name = "simulator-kasane-wasm"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kasane = { path = "../../kasane" }
libtetris = { path = "../../third_party/cold-clear-reference/libtetris" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
