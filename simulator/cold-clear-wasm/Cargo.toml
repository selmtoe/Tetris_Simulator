[package]
name = "simulator-cold-clear-wasm"
version = "0.1.0"
edition = "2018"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arrayvec = { version = "0.5", features = ["serde"] }
bincode = "1.3.1"
bumpalo = { version = "3.4.0", features = ["collections"] }
enum-map = { version = "0.6.0", features = ["serde"] }
enumset = { version = "1.0.4", features = ["serde"] }
lazy_static = "1.4.0"
odds = { version = "0.3.1", features = ["std-vec"] }
ouroboros = "0.14.0"
rand = "0.7.0"
ruzstd = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde-big-array = "0.2.0"
serde_json = "1"

[dependencies.libtetris]
package = "libtetris"
path = "../../third_party/cold-clear-reference/libtetris"

[dependencies.opening-book]
package = "opening-book"
path = "../../third_party/cold-clear-reference/opening-book"
