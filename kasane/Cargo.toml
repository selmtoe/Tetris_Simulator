[package]
name = "kasane"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
default-run = "kasane"

[lib]
name = "kasane"
path = "src/lib.rs"

[[bin]]
name = "kasane"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rand = "0.7.3"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.libtetris]
package = "libtetris"
path = "../third_party/cold-clear-reference/libtetris"

[dependencies.simulator-cold-clear-wasm]
package = "simulator-cold-clear-wasm"
path = "../simulator/cold-clear-wasm"
features = ["deterministic-search"]

[dev-dependencies]
approx = "0.5"
