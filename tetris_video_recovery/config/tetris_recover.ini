; Source-compatible recovery settings.
; Queue coordinates intentionally remain identical to 動画解析.html:
; 1280-wide coordinates, cropW/1280 scale, 5px circular samples.
; Board rectangles are calibrated to the inner 10x20 playfield of the
; Puyo Puyo Tetris layout. This removes the blue/red frame pixels which the
; ONNX model otherwise mistakes for J/Z blocks. Set them back to the source
; rectangles (P1 304,157,366,725 / P2 1250,157,363,725) only when a video
; was recorded with that exact older layout.

[video]
sample_interval=0.01
queue_confirm=2
; The NEXT decoder works on compressed full-history runs.  It only permits
; legal 0/1/2 slides and, by default, a strict Guideline 7-bag generator.
queue_beam_width=96
queue_7bag=1
; A legal placement that matches all 200 ONNX-visible cells is definitive.
; It is kept even if another beam branch has a better older cumulative score.
force_exact_onnx=1
onnx_samples=5
beam_width=500
shift_threshold=0.60
score_exact=10
score_empty=1
score_color=-2
score_missing=-5
score_extra=-5

[players]
p1_enabled=1
p2_enabled=1

[p1]
board=316,157,351,713
hold=160,155
next1=500,122
next2=500,175
next3=500,225
next4=500,275
next5=500,325

